<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160e1b">
  <meta name="description" content="A quiet purple room. Click the fridge to look closer.">
  <title>The Purple Room</title>
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="./assets/room.jpg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="room" id="room" aria-label="Interactive Blender room">
    <div class="ambient" aria-hidden="true"></div>
    <div class="scene" id="scene" data-view="room">
      <img class="room-image" id="room-image" src="./assets/room.jpg" width="1824" height="1368" alt="A purple-lit room with a pink playpen, marble breakfast bar, hanging lamp, and a silver fridge in the kitchen." draggable="false" fetchpriority="high">
      <img class="detail-image" id="detail-image" width="1824" height="1368" alt="Close-up of the silver fridge, including the magnets and handwritten note on its doors." draggable="false" aria-hidden="true">
      <button class="fridge-target" id="fridge" aria-label="Zoom in on the fridge" aria-describedby="hint" disabled>
        <span class="fridge-outline" aria-hidden="true"></span>
      </button>
    </div>
    <div class="controls">
      <p class="hint" id="hint">Click the fridge to look closer</p>
      <button class="back" id="back" hidden aria-label="Zoom out to the room">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
        Back to room
      </button>
    </div>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    <noscript><p class="no-script">Enable JavaScript to zoom in on the fridge.</p></noscript>
  </main>
</body>
</html>
